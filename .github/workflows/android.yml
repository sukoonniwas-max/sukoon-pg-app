name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the app screens
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0e6b63' --iconBackgroundColorDark '#0e6b63' --splashBackgroundColor '#0e6b63' --splashBackgroundColorDark '#0e6b63'

      - name: Copy screens into Android
        run: npx cap sync android

      - name: Use the app's fixed signing key (so updates install over the old version)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SukoonPG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SukoonPG-apk
          path: SukoonPG.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SukoonPG.apk \
            --title "Sukoon PG app (latest)" \
            --notes "Build ${{ github.run_number }}. Open this page on your Android phone, tap SukoonPG.apk under Assets, then Install."
