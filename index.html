<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b63">
<title>Sukoon PG Network</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Sukoon <span>PG Network</span></h1>
      <div class="stats" id="stats"></div>
    </div>

  </header>

  <section id="view-dash" hidden><div class="dash" id="dash"></div></section>

  <section id="view-pgs">
    <div class="tools">
      <div class="tool-row">
        <button class="btn primary" id="find-btn" type="button">Find PGs on Google Maps</button>
        <button class="btn" id="addmaps-btn" type="button">Add from Maps link</button>
      </div>
      <input class="search" id="q-pgs" type="search" placeholder="Search PG, area, owner, metro…">
      <select class="search" id="loc-pgs" aria-label="Locality"></select>
      <div class="chips" id="chips-pgs"></div>
    </div>
    <div class="list" id="list-pgs"></div>
  </section>

  <section id="view-deal" hidden>
    <div class="tools">
      <div class="tool-row">
        <button class="btn primary" id="find-deal-btn" type="button">Find dealers on Google Maps</button>
        <button class="btn" id="add-deal-btn" type="button">+ Add dealer</button>
      </div>
      <input class="search" id="q-deal" type="search" placeholder="Search dealer, number, locality…">
      <select class="search" id="loc-deal" aria-label="Locality"></select>
    </div>
    <div class="list" id="list-deal"></div>
  </section>

  <section id="view-inq" hidden>
    <div class="tools">
      <input class="search" id="q-inq" type="search" placeholder="Search name, phone, area, enquiry ID…">
      <div class="chips" id="chips-inq"></div>
    </div>
    <div class="list" id="list-inq"></div>
  </section>
</div>

<nav class="bottomnav" role="tablist" aria-label="Sections">
  <button class="tab" id="tab-dash" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
  <button class="tab" id="tab-pgs" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>PGs <i class="n" id="n-pgs">0</i></span></button>
  <button class="tab" id="tab-inq" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Enquiries <i class="n" id="n-inq">0</i></span></button>
  <button class="tab" id="tab-deal" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span>Dealers <i class="n" id="n-deal">0</i></span></button>
</nav>
<button class="fab" id="fab" hidden>+ Add PG</button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<datalist id="loc-list"></datalist>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-logo">S</div>
    <h1>Sukoon <span>PG Network</span></h1>
    <h2 id="auth-title">Sign in</h2>
    <form id="auth-form">
      <label>Email<input id="auth-email" type="email" autocomplete="email" required></label>
      <label>Password<input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn primary" id="auth-go" type="submit">Sign in</button>
      <div class="auth-links"><button type="button" class="copy" id="auth-switch"></button><button type="button" class="copy" id="auth-forgot">Forgot password</button></div>
    </form>
    <p class="auth-msg" id="auth-msg" role="alert"></p>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
