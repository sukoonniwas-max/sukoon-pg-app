<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b63">
<title>Sukoon PG Network</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Sukoon <span>PG Network</span></h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-dash" role="tab" aria-selected="false">Dashboard</button>
      <button class="tab" id="tab-pgs" role="tab" aria-selected="true">PGs <span class="n" id="n-pgs">0</span></button>
      <button class="tab" id="tab-inq" role="tab" aria-selected="false">Enquiries <span class="n" id="n-inq">0</span></button>
    </div>
  </header>

  <section id="view-dash" hidden><div class="dash" id="dash"></div></section>

  <section id="view-pgs">
    <div class="tools">
      <input class="search" id="q-pgs" type="search" placeholder="Search PG, area, owner, metro…">
      <select class="search" id="loc-pgs" aria-label="Locality"></select>
      <div class="chips" id="chips-pgs"></div>
    </div>
    <div class="list" id="list-pgs"></div>
  </section>

  <section id="view-inq" hidden>
    <div class="tools">
      <input class="search" id="q-inq" type="search" placeholder="Search name, phone, area, enquiry ID…">
      <div class="chips" id="chips-inq"></div>
    </div>
    <div class="list" id="list-inq"></div>
  </section>
</div>

<button class="fab" id="fab" hidden>+ Add PG</button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<datalist id="loc-list"></datalist>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-logo">S</div>
    <h1>Sukoon <span>PG Network</span></h1>
    <h2 id="auth-title">Sign in</h2>
    <form id="auth-form">
      <label>Email<input id="auth-email" type="email" autocomplete="email" required></label>
      <label>Password<input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn primary" id="auth-go" type="submit">Sign in</button>
      <div class="auth-links"><button type="button" class="copy" id="auth-switch"></button><button type="button" class="copy" id="auth-forgot">Forgot password</button></div>
    </form>
    <p class="auth-msg" id="auth-msg" role="alert"></p>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
